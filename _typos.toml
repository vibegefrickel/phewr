# The spelling check of typos-cli. The words below are names and domain terms, not typos.
[default]
extend-ignore-re = ["\\\\x1b\\[[0-9;?<>]*[a-zA-Z]", "\\b[0-9a-f]{7,40}\\b", "live-foto"]

[default.extend-words]
herdr = "herdr"
schnattr = "schnattr"
youtr = "youtr"
phewr = "phewr"
agendr = "agendr"
tuilibr = "tuilibr"
cendre = "cendre"
ratatui = "ratatui"
moxcms = "moxcms"
turbojpeg = "turbojpeg"
libheif = "libheif"
sips = "sips"
qlmanage = "qlmanage"
CLL = "CLL"
flate = "flate"
flate2 = "flate2"
clli = "clli"

[files]
extend-exclude = ["Cargo.lock", "target/**"]
