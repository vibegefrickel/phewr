[package]
name = "phewr"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

# Not on crates.io: users clone the repository and build phewr with `just install`.
publish = false
description = "Terminal image and video gallery for the Kitty graphics protocol: thumbnail grid, slideshow, EXIF, HEIC"
license = "MIT"
repository = "https://codeberg.org/webgefrickel/phewr"

# The lint set is the rule set. `just check` turns every warning into an error. A local
# exception is `#[expect(lint, reason = "...")]`, never `#[allow]`.
[lints.rust]
# phewr needs no unsafe code. A single exception needs `#[expect(unsafe_code, reason)]` and a
# `// SAFETY:` comment.
unsafe_code = "deny"
# A `pub` item that no path outside the crate can reach must be `pub(crate)`, so rustc still
# reports it as dead code. phewr is a binary crate, so every module is private.
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
meta_variable_misuse = "warn"
macro_use_extern_crate = "warn"
missing_abi = "warn"
non_ascii_idents = "warn"
# A binary crate exports no item, so these two lints check only the crate root. They stay for the
# same table as tuilibr.
missing_docs = "warn"
missing_debug_implementations = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
impl_trait_redundant_captures = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "allow"
unescaped_backticks = "warn"
missing_crate_level_docs = "warn"

# Cargo checks the dependencies that no target uses. It never checks `[dev-dependencies]`;
# `just audit` runs cargo-shear for those.
[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic = "warn"
exit = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
mem_forget = "warn"
rest_pat_in_fully_bound_structs = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
clone_on_ref_ptr = "warn"
str_to_string = "warn"
string_slice = "warn"
string_add = "warn"
format_push_string = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
tests_outside_test_module = "warn"
redundant_test_prefix = "warn"
ref_patterns = "warn"
pathbuf_init_then_push = "warn"
needless_raw_strings = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
error_impl_error = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
rc_mutex = "warn"
use_self = "warn"
redundant_clone = "warn"
needless_pass_by_ref_mut = "warn"
cognitive_complexity = "warn"
collection_is_never_read = "warn"
derive_partial_eq_without_eq = "warn"
equatable_if_let = "warn"
set_contains_or_insert = "warn"
significant_drop_in_scrutinee = "warn"
iter_on_single_items = "warn"
iter_on_empty_collections = "warn"
unused_peekable = "warn"
unnecessary_struct_initialization = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
useless_let_if_seq = "warn"
nonstandard_macro_braces = "warn"
path_buf_push_overwrite = "warn"
string_lit_as_bytes = "warn"
fallible_impl_from = "warn"
read_zero_byte_vec = "warn"
debug_assert_with_mut_call = "warn"
# A dropped `Result` (`let _ = tx.send(..)`) must be a visible decision with a reason.
let_underscore_must_use = "warn"
# Restriction lints that match the rules: no panic in a fallible function, no lossy literal, one
# file layout, no needless async.
panic_in_result_fn = "warn"
assertions_on_result_states = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
self_named_module_files = "warn"
empty_structs_with_brackets = "warn"
unnecessary_self_imports = "warn"
pub_without_shorthand = "warn"
redundant_type_annotations = "warn"
unused_async = "warn"

# Pedantic lints that do not fit this codebase.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
large_futures = "allow"
assert_is_empty = "allow"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6"
# Only the decoders for the formats that the scanner lists. AVIF goes through libheif.
image = { version = "0.25.10", default-features = false, features = ["bmp", "exr", "gif", "hdr", "ico", "jpeg", "png", "qoi", "tga", "tiff", "webp"] }
jiff = "1"
kamadak-exif = "0.6"
# The tests and the benches name the types of libheif. The decode goes through tuilibr.
libheif-rs = { version = "3", optional = true }
lru = "0.19"
# The color profiles of the tone map cubes of the player (`player/tone_map/`). `image` still uses
# moxcms 0.8.
moxcms = { version = "0.9.2", optional = true }
nucleo-matcher = "0.3"
ratatui = "0.30"
rayon = "1.12"
# The Lucide icons of the grid cells (`assets/icons/`), rendered at the pixel size of the cell.
# No text, no fonts and no raster images: the icons are paths only.
resvg = { version = "0.50", default-features = false }
serde = { version = "1", features = ["derive"] }
# The JSON output of `ffprobe`.
serde_json = { version = "1", optional = true }
toml = "1"
# The shared parts of the apps (../tuilibr): the status row, the dialog boxes and the picture
# module. The features of phewr turn on its decoders.
tuilibr = { path = "../tuilibr" }
# The benches call libjpeg-turbo directly. The decode goes through tuilibr. Without the default
# feature `cmake`, turbojpeg-sys finds the Homebrew libjpeg-turbo through pkgconf.
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config", "require-simd"], optional = true }
unicode-width = "0.2"

[dev-dependencies]
# The benches compare the resize layouts.
fast_image_resize = "6.1"
tempfile = "3.27"
# The test helpers of the picture module: the fixture writers, the key events and the counters of
# the disk cache.
tuilibr = { path = "../tuilibr", features = ["test-support"] }

[features]
default = ["turbo", "heic", "jxl", "video", "sips"]
# Fast JPEG decoding with DCT downscaling (libjpeg-turbo).
turbo = ["tuilibr/turbo", "dep:turbojpeg"]
# HEIC / HEIF and AVIF through the system libheif (>= 1.19).
heic = ["tuilibr/heic", "dep:libheif-rs"]
# JPEG XL in pure Rust (jxl-oxide).
jxl = ["tuilibr/jxl"]
# Video playback and first-frame thumbnails through the `ffmpeg` and `ffprobe` programs on PATH,
# and the mpv window. phewr links no FFmpeg library.
video = ["dep:serde_json", "dep:moxcms"]
# Camera RAW, PSD, PDF, SVG and the other ImageIO formats through macOS `/usr/bin/sips`. The
# feature has no effect on other systems.
sips = ["tuilibr/sips"]

# Image decoding is slow without optimizations, also in debug builds and tests.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
