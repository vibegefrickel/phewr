# cargo-deny: dependency policy. `just deny` runs all four checks.

[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
# RustSec database. Unmaintained crates we pull in directly are listed with the reason.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# phewr is MIT, so dependencies must be permissive. The native libraries (libheif,
# libjpeg-turbo) are system libraries outside this graph, and phewr starts the FFmpeg programs
# without a link. MPL-2.0 (nucleo-matcher, option-ext) is file-level copyleft: phewr ships them
# unchanged, and their source stays on crates.io.
# Add a license here only when a new dependency needs it: unused entries are warnings.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "BSL-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.8
# This crate is not published (publish = false).
private = { ignore = true }

[bans]
# Several versions of one crate are reported, not fatal.
multiple-versions = "warn"
wildcards = "deny"
# A path dependency without a version (tuilibr) is no wildcard of crates.io.
allow-wildcard-paths = true
highlight = "all"
# The older version of each duplicate pair, with the crate that pulls it. phewr and tuilibr use
# the newer one. The pre-commit hook of the dotfiles runs this check at every commit, so the
# known pairs stay silent. Remove an entry when its parent moves on.
skip = [
  { crate = "lru@0.18.5", reason = "ratatui-core 0.1 uses lru 0.18, phewr and tuilibr 0.19" },
  { crate = "miniz_oxide@0.8.9", reason = "exr and png (image, resvg) use 0.8, flate2 and tiff use 0.9" },
  { crate = "moxcms@0.8.1", reason = "image and jxl-oxide use moxcms 0.8, phewr and tuilibr 0.9 for the ICC curves" },
  { crate = "syn@2.0.119", reason = "derive_more (crossterm) uses syn 2, the other derives use syn 3" },
  { crate = "thiserror@1.0.69", reason = "turbojpeg uses thiserror 1, fast_image_resize and kasuari use 2" },
  { crate = "thiserror-impl@1.0.69", reason = "the derive of thiserror 1 for turbojpeg" },
]

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
