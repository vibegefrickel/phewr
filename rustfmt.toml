# rustfmt is the only formatter; options are deliberately few and all stable. The 2024 style
# edition sorts imports by version order and formats `let ... else` and closures the modern way.
style_edition = "2024"
use_field_init_shorthand = true
use_try_shorthand = true
newline_style = "Unix"
# Nightly-only options we would like (`imports_granularity = "Crate"`, `group_imports =
# "StdExternalCrate"`, `wrap_comments`) are left out: stable rustfmt would warn on every run.
